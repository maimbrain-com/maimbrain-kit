# Builds mb for each platform when a v* tag is pushed and attaches the archives
# to the GitHub release (maimbrain.com/install.sh and install.ps1 download them).
# Tags come from the monorepo's kit release, which pushes main and the tag together
# only after the monorepo's CI ran these same tests (.github/ci/test.sh) on this
# kit on Linux, macOS and Windows, so a tag goes straight to the builds. Pull
# requests here (and Actions → release → Run workflow) run the tests.
# Pushes to main build too, without publishing: they keep each platform's
# compiled dependencies cached, which the next tag's builds start from.
name: release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Every part of the tests (bash on all three: Git Bash on Windows). The
      # monorepo's PR CI runs this script too, on each kit before it's published.
      - name: Test the kit (.github/ci/test.sh)
        shell: bash
        run: bash .github/ci/test.sh

  build:
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }  # cross-compiled; GitHub is retiring Intel runners
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The dependencies, compiled; saved from main (tags read main's caches).
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build -p mb-cli --release --target ${{ matrix.target }}
      - name: Package (tar.gz)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Windows'
        run: tar -czf mb-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release mb
      - name: Package (zip)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/mb.exe -DestinationPath mb-${{ matrix.target }}.zip
      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          gh release create "$TAG" --title "$TAG" --generate-notes 2>/dev/null || true
          gh release upload "$TAG" mb-${{ matrix.target }}.* --clobber
