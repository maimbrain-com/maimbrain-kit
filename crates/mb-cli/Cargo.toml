[package]
name = "mb-cli"
description = "The `mb` command: build, pack and validate Maimbrain games"
edition.workspace = true
version = "0.10.0"
publish.workspace = true

[dependencies]
base64 = "0.23"
clap = { version = "4.6.7", features = ["derive"] }
mb-format = { version = "0.0.0", path = "../mb-format" }
# Shader materials' checks (docs/STUDIO-2.md §4.15): the same crate the app's mb-host runs, so
# write_files and mb build refuse exactly what a phone would.
mb-shader = { path = "../mb-shader" }
# Luau's compiler: Studio 2.0 projects' Lua is compiled to bytecode when packed (docs/STUDIO-2.md §4.13).
luau = { version = "0.0.0", path = "../luau", features = ["compiler", "analyze"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha1_smol = "1"
sha2 = "0.11"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "wav", "pcm", "ogg", "vorbis"] }
toml = "1.1.6"
# Font outlines, metrics, kerning and variations for `mb font add`.
ttf-parser = "0.25"
# meshoptimizer (C++, built with cc): simplifying generated 3D models for `mb model`.
meshopt = "0.6"
ureq = { version = "3", features = ["json"] }
# Baseline JPEG for `mb art sky` panoramas (photographic skies are far smaller than PNG)
# and for `mb model` textures.
jpeg-encoder = "0.7"
# Ogg Vorbis encoding (libvorbis with aoTuV, built from source), so no oggenc is needed.
vorbis_rs = { version = "0.5.6", default-features = false }
zune-jpeg = "0.5.15"
# Engine 2.0 natively, for `mb difficulty`'s native runner (the bot's rounds on the SDK's
# stubbed host), and the SDK's difficulty report.
studio-engine2 = { path = "../../games/studio-engine2" }
maimbrain = { path = "../../sdk/maimbrain", features = ["scene"] }

[[bin]]
name = "mb"
path = "src/main.rs"

[dev-dependencies]
# Stand-in servers for the integration tests (mb serve has its own: serve.rs).
tiny_http = "0.12"
