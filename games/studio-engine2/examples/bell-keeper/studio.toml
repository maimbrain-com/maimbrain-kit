# Bell Keeper (docs/STUDIO-2.md §9.5, Phase 4b): a game that teaches
# through hints, and the difficulty bot plays it from them alone, with no
# bot.lua: it rings the bell the hint points at, holds the rope on HOLD and
# lets go on LET GO. Placeholder art: shapes.
title = "Bell Keeper"
tagline = "Ring them while they glow"
