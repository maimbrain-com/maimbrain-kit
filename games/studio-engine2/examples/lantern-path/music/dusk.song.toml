# Dusk: a slow, quiet loop (a stand-in for a generated one).
bpm = 84
order = ["a", "b"]

[voices.pulse1]
duty = 0.25
volume = 0.12

[patterns.a]
pulse1   = "E4 . G4 . B4 . G4 . A4 . . . G4 . E4 ."
triangle = "E2 . . . E2 . . . C2 . . . D2 . . ."

[patterns.b]
pulse1   = "D4 . F#4 . A4 . F#4 . G4 . . . E4 . . ."
triangle = "D2 . . . D2 . . . C2 . . . B1 . . ."
