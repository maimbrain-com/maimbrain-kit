# Neon Dash on engine 2.0: engine 1.0's runner example
# (games/studio-engine/examples/runner), moved up by upgrade_engine and
# finished by hand. The Arcade preset keeps its 1.0 look.
title = "Neon Dash"
tagline = "jump the crates"
kind = "2d"
engine = "2.0"
orientation = "landscape"

# The manifest's identity for `mb build` (Studio's server sets its own).
id = "dev.maimbrain.studio2.neondash"
version = "0.1.0"
creator = "@maimbrain"

# 1.0's look and limits inside 2.0 (reference("arcade")): the 16 colours, 16- and 32-pixel art, the pixel font.
preset = "arcade"
palette = "night16"
background = 2

[identity]
name = "neon"
title_font = "Press Start 2P"     # the pixel art's own font, for the title and numbers
number_font = "Press Start 2P"


[[scores]]
label = "Distance"
order = "high"

[text]
over = "CRASHED!"

[remix]
allowed = true
