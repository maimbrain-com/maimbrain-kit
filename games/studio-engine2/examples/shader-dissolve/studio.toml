# Ember Dock: Phase 5's dissolve shader (docs/STUDIO-2.md §9.6). Crates on
# a dock at dusk; tap one to burn it away (shaders/dissolve.wgsl: a noise
# cut with a glowing rim, its `t` tweened by flux). Marked crates score;
# burning an unmarked one costs time.
title = "Ember Dock"
tagline = "Burn the marked crates"
kind = "3d"
engine = "2.0"
orientation = "portrait"

# The manifest's identity for `mb build` (Studio's server sets its own).
id = "dev.maimbrain.studio2.emberdock"
version = "0.1.0"
creator = "@maimbrain"

[identity]
name = "saloon"

[[scores]]
label = "Crates"
order = "high"

[text]
over = "TIME!"
