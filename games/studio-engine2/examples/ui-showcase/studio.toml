# The UI kit's showcase (docs/STUDIO-2.md §9.5, Phase 4b): every widget,
# a hint that follows what it points at, a lesson, the combo meter, the
# countdown and the stats card, in the game's identity. Change `name` below
# to see them in another of the 17.
title = "UI Showcase"
tagline = "Every widget, in the identity"
engine = "2.0"
kind = "2d"
orientation = "portrait"

# The manifest's identity for `mb build` (Studio's server sets its own).
id = "dev.maimbrain.studio2.ui-showcase"
version = "0.1.0"
creator = "@maimbrain"

[identity]
name = "riso"

[[scores]]
label = "Points"
order = "high"

[remix]
allowed = true
