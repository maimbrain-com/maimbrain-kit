# The flappy starter: a chick flaps between candy pillars in a pastel sky.
# Its look (the pictures, sounds and identity) is the starter's, drawn by
# tools/studio/starter_art.py: a stand-in to replace with the game's own,
# in DESIGN.md's look (docs/STUDIO.md "The first version").
title = "Candy Sky"
tagline = "tap to flap"
engine = "2.0"
kind = "2d"
orientation = "portrait"
lives = 1

# The manifest's identity for `mb build` (Studio's server sets its own).
id = "dev.maimbrain.studio2.flappy"
version = "0.1.0"
creator = "@maimbrain"

# The cards and HUD (the reference topic "identity"): the starter's, like its art.
[identity]
name = "bubblegum"

[text]
over = "BONK!"

[[scores]]
label = "Gaps"
order = "high"

[remix]
allowed = true
