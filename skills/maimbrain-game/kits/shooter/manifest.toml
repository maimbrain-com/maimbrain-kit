abi = 0
id = "com.maimbrain.terracatta.nova-pip"
name = "Nova Pip"
version = "0.1.0"
creator = "@terracatta"

orientation = "portrait"
logical_size = [360, 640]
inputs = ["touch"]
perf_tier = "lite"

stdlib = { mb2d = 1 }
sensors = ["haptics"]
capabilities = ["store", "score"]
startup_assets = ["assets/sprites.png", "assets/backdrop.png", "assets/shot.ogg", "assets/pop.ogg", "assets/hit.ogg", "assets/gem.ogg", "assets/start.ogg", "assets/music_base.ogg", "assets/music_hi.ogg"]

[[scores]]
board = 0
label = "Score"
order = "higher"
format = "integer"

[[scores]]
board = 1
label = "Daily score"
order = "higher"
format = "integer"
daily = true
