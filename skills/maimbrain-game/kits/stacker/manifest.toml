abi = 0
id = "com.maimbrain.terracatta.picnic-pile"
name = "Picnic Pile"
version = "0.1.0"
creator = "@terracatta"

orientation = "portrait"
logical_size = [360, 640]
inputs = ["touch"]
perf_tier = "lite"

stdlib = { mb2d = 1 }
sensors = ["haptics"]
capabilities = ["store", "score"]
startup_assets = ["assets/sprites.png", "assets/bird.png", "assets/faces.png", "assets/paper.png", "assets/start.ogg", "assets/drop.ogg", "assets/thud.ogg", "assets/land.ogg", "assets/neat.ogg"]

[[scores]]
board = 0
label = "Snacks"
order = "higher"
format = "integer"

[[scores]]
board = 1
label = "Daily snacks"
order = "higher"
format = "integer"
daily = true
