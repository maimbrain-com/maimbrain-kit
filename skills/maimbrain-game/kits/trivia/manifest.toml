abi = 0
id = "com.maimbrain.terracatta.bright-spark"
name = "Bright Spark"
version = "0.1.0"
creator = "@terracatta"

orientation = "portrait"
logical_size = [360, 640]
inputs = ["touch"]
perf_tier = "lite"

stdlib = { mb2d = 1 }
sensors = ["haptics"]
capabilities = ["store", "score"]
startup_assets = ["assets/stage.png", "assets/host.png", "assets/cats.png", "assets/marquee.png", "assets/start.ogg", "assets/flip.ogg", "assets/tap.ogg", "assets/right.ogg", "assets/wrong.ogg", "assets/tick.ogg"]

[[scores]]
board = 0
label = "Points"
order = "higher"
format = "integer"

[[scores]]
board = 1
label = "Daily points"
order = "higher"
format = "integer"
daily = true
